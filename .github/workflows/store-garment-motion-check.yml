name: Store and Garment Motion Checks

on:
  push:
    branches: [main, feature/garment-motion-engine]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify storefront and garment motion integration
        run: node scripts/verify-garment-motion.mjs
