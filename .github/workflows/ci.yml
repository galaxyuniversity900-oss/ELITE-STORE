name: Monorepo CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test and build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disposable credentials used only by this isolated CI stack.
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/mes_store?schema=public
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate JSON and commerce policy
        run: |
          node -e "for (const f of ['package.json','turbo.json','apps/api/package.json','apps/web/package.json','apps/admin/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Workspace JSON: OK')"
          node -e "for (const f of ['data/products.json','data/contact.json','data/discounts.json','data/sections/index.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Store data JSON: OK')"
          test -s docs/commerce/COMMERCE_RULES.md
          grep -q "Release gates" docs/commerce/COMMERCE_RULES.md

      - name: Type-check workspaces
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build all applications
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Start full Docker stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --build

      - name: Wait for API readiness and smoke test API and web
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:4000/api/health >/tmp/api-health.json 2>/tmp/api-health.err; then
              ready=1
              break
            fi
            echo "API is not ready yet (attempt $attempt/60)"
            docker compose -f infra/docker/docker-compose.yml logs --tail=30 api
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/api-health.err || true
            exit 1
          fi
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:4000/api/products -o /tmp/api-products.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/api-products.json','utf8')); if (!x || !Array.isArray(x.items)) process.exit(1); console.log('API products smoke test: OK')"
          web_ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:3000/ -o /tmp/storefront.html; then
              web_ready=1
              break
            fi
            echo "Web is not ready yet (attempt $attempt/30)"
            sleep 2
          done
          test "$web_ready" -eq 1
          grep -qi "MES STORE" /tmp/storefront.html

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

      - name: Verify garment motion engine
        run: node scripts/verify-garment-motion.mjs
