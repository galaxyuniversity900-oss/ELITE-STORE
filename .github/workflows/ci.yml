name: MES STORE CI

on:
  push:
    branches: [main, completion/storefront-experience, notifications/distributed-worker, notifications/provider-production-readiness, security/commerce-webhook-admin-hardening, qa/commerce-e2e-load-restore]
  pull_request:
    branches: [main, completion/storefront-experience, notifications/distributed-worker, notifications/provider-production-readiness, security/commerce-webhook-admin-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-12345
      DATABASE_URL: postgresql://mes_store:ci-only-postgres-password-12345@localhost:5432/mes_store?schema=public
      REDIS_PASSWORD: ci-only-redis-password-12345
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-12345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate notification provider preflight script syntax
        run: node --check scripts/verify-notification-providers.mjs
      - name: Verify SEO metadata, sitemap and product structured data
        run: node --check scripts/generate-static-seo.mjs && node scripts/verify-seo.mjs
      - name: Validate workspace and store configuration
        run: |
          node -e "for (const f of ['package.json','apps/api/package.json','apps/web/package.json','apps/admin/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Workspace JSON: OK')"
          node -e "for (const f of ['data/products.json','data/contact.json','data/discounts.json','data/sections/index.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Store data JSON: OK')"
          test -s docs/commerce/COMMERCE_RULES.md
          grep -q "Release gates" docs/commerce/COMMERCE_RULES.md
          test -s prisma/migrations/20261102080000_initial_commerce/migration.sql
          test -s prisma/migrations/20261102110000_commerce_integrity_checks/migration.sql
          grep -q 'orders_total_reconciliation_check' prisma/migrations/20261102110000_commerce_integrity_checks/migration.sql
      - name: Type-check workspaces
        run: npm run lint
      - name: Run automated tests
        run: npm test
      - name: Build all applications
        run: npm run build
      - name: Verify API runtime entrypoint
        run: test -s apps/api/dist/main.js
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - name: Start full Docker stack
        run: docker compose --parallel 1 -f infra/docker/docker-compose.yml up -d --build
      - name: Wait for API, web and admin readiness
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:4000/api/health >/tmp/api-health.json 2>/tmp/api-health.err; then ready=1; break; fi
            echo "API is not ready yet (attempt $attempt/60)"
            docker compose -f infra/docker/docker-compose.yml logs --tail=30 api
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/api-health.err || true; exit 1; fi
          constraint_count=$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U mes_store -d mes_store -Atc "SELECT COUNT(*) FROM pg_constraint WHERE conname IN ('products_price_positive_check','products_compare_at_price_nonnegative_check','products_stock_nonnegative_check','cart_items_quantity_range_check','cart_items_unit_price_nonnegative_check','orders_totals_nonnegative_check','orders_total_reconciliation_check','orders_discount_within_total_check','order_items_quantity_positive_check','order_items_amounts_nonnegative_check','order_items_line_total_check','payments_amount_nonnegative_check')")
          test "$constraint_count" = "12"
          echo "Database integrity constraints: $constraint_count/12"
          notification_tables=$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U mes_store -d mes_store -Atc "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('notification_outbox','notification_delivery_attempts','notification_delivery_events')")
          test "$notification_tables" = "3"
          echo "Notification outbox tables: $notification_tables/3"
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:4000/api/products -o /tmp/api-products.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/api-products.json','utf8')); if (!x || !Array.isArray(x.items)) process.exit(1); console.log('API products smoke test: OK')"
          web_ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:3000/ -o /tmp/storefront.html; then web_ready=1; break; fi
            sleep 2
          done
          test "$web_ready" -eq 1
          grep -qi "MES STORE" /tmp/storefront.html
          node -e "const products=JSON.parse(require('fs').readFileSync('/tmp/api-products.json','utf8')).items; const html=require('fs').readFileSync('/tmp/storefront.html','utf8'); const product=products?.[0]; if (!product?.name || !html.includes('أحدث المنتجات') || !html.includes(product.name)) { console.error('Storefront did not server-render a catalogue product'); process.exit(1); } console.log('Storefront SSR product browsing smoke test: OK')"
          admin_ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:3001/ -o /tmp/admin.html; then admin_ready=1; break; fi
            sleep 2
          done
          test "$admin_ready" -eq 1
          grep -qi "تسجيل دخول الإدارة" /tmp/admin.html
          curl --silent --show-error --fail -X POST http://localhost:4000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"ci-only-bootstrap-password-12345"}' -o /tmp/admin-login.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/admin-login.json','utf8')); if (!x.accessToken || x.user.role !== 'SUPER_ADMIN') process.exit(1); console.log('Admin authentication smoke test: OK')"
          if [ -s scripts/verify-notification-outbox.mjs ]; then
            order_id=$(node scripts/verify-notification-outbox.mjs)
            test -n "$order_id"
            notification_count=$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U mes_store -d mes_store -Atc "SELECT COUNT(*) FROM notification_outbox WHERE \"orderId\" = '$order_id'")
            channel_count=$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U mes_store -d mes_store -Atc "SELECT COUNT(DISTINCT \"channel\") FROM notification_outbox WHERE \"orderId\" = '$order_id'")
            dedupe_count=$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U mes_store -d mes_store -Atc "SELECT COUNT(DISTINCT \"dedupeKey\") FROM notification_outbox WHERE \"orderId\" = '$order_id'")
            test "$notification_count" = "2"
            test "$channel_count" = "2"
            test "$dedupe_count" = "2"
            echo "Transactional outbox checkout smoke test: OK (2 channels, 2 unique dedupe keys)"
          fi
      - name: Run full commerce E2E journey
        env:
          API_BASE_URL: http://127.0.0.1:4000/api
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-12345
        run: npm run qa:commerce:e2e
      - name: Run storefront load test (k6)
        run: npm run qa:storefront:load
      - name: Verify PostgreSQL backup and restore
        run: npm run qa:postgres:restore
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
      - name: Verify garment motion engine
        run: node scripts/verify-garment-motion.mjs
      - name: Verify commercial checkout readiness
        run: node scripts/verify-commercial-readiness.mjs
      - name: Verify PowerPoint motion embeds
        run: npm run verify:motion-embeds
      - name: Verify product image lab
        run: npm run verify:product-image-lab
      - name: Verify photography workflow security
        run: node scripts/verify-photography-workflow.mjs
